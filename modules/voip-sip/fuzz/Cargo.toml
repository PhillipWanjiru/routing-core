[package]
name    = "voip-sip-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
voip-sip = { path = ".." }

[[bin]]
name = "fuzz_sip_parser"
