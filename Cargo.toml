[workspace]
resolver = "2"
members  = ["core", "modules/voip-sip"]
exclude  = ["modules/voip-sip/fuzz", "modules/nat-traversal/fuzz"]

[workspace.dependencies]
tokio   = { version = "=1.35.1",   features = ["full"] }
serde   = { version = "=1.0.193",  features = ["derive"] }
tracing = "=0.1.40"
anyhow  = "=1.0.102"
nom     = "=7.1.3"
bytes   = "=1.5.0"
dashmap = "=5.5.3"
